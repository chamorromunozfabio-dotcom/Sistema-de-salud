version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: saludpublica-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saludpublica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saludpublica-network

  # Redis for caching and Bull queues
  redis:
    image: redis:7-alpine
    container_name: saludpublica-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - saludpublica-network

  # Redis Commander (optional - for visualizing Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: saludpublica-redis-commander
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - saludpublica-network
    depends_on:
      - redis

  # Backend NestJS
  backend:
    build: ./backend
    container_name: saludpublica-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saludpublica?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: sanare-super-secret-jwt-key-for-development-purposes-only-32chars
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: ""
      EMAIL_PASS: ""
      EMAIL_FROM: "SaludPública Connect <noreply@saludpublica.com>"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-tu_api_key_de_google_ai}
    depends_on:
      - postgres
      - redis
    networks:
      - saludpublica-network
    env_file:
      - ./backend/.env

  # Frontend React + Vite
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-tu_api_key_aqui}
    container_name: saludpublica-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-tu_api_key_aqui}
    depends_on:
      - backend
    networks:
      - saludpublica-network

volumes:
  postgres_data:
  redis_data:

networks:
  saludpublica-network:
    driver: bridge
